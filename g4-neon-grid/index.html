<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Neon Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060614;
      background: radial-gradient(circle at 50% 50%, #161638 0%, #050512 100%);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    #game-container canvas {
      display: block;
      box-shadow: 0 0 60px rgba(0, 245, 255, 0.15), 0 0 120px rgba(255, 0, 255, 0.08), 0 25px 70px rgba(0, 0, 0, 0.95);
      border-radius: 16px;
      border: 1px solid rgba(0, 245, 255, 0.15);
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
