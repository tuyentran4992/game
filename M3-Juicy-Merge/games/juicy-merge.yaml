name: juicy-merge
version: 0.1.0

metadata:
  title: "Juicy Merge: Fruit Pop"
  short_desc: "Drop fruit, merge two of a kind into a bigger one! A juicy physics puzzle — grow the chain to a giant watermelon and set records."
  genre: ["Puzzle", "Casual"]
  theme: "fruity kawaii merge"
  style: "pastel kawaii fruit, bold outline, juicy satisfying merge pops"
  flag_movie: false

