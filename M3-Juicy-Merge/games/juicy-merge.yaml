mechanics:
  # (dummy kế thừa validate pipeline M1 — M3 không dùng lane/bee)
  lane_count: 3
  bee: { base_speed: 0 }
  # Physics-merge core
  bucket_width: 640
  bucket_height_ratio: 0.70
  danger_line_ratio: 0.20
  drop_cooldown_ms: 250
  drop_start_ratio: 0.0
  chain:
    - cherry
    - strawberry
    - grape
    - dekopon
    - pomegranate
    - orange
    - apple
    - pear
    - peach
    - pineapple
    - melon
    - watermelon
  score_per_tier: [1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 66, 100]
  combo_window_ms: 2000
  physics:
    gravity_y: 1.0
    restitution: 0.1
    friction: 0.8
    sleep_threshold: 60
  # (dummy — để pipeline validate config chung M1 pass; M3 không dùng combo/milestone)
  progression:
    milestone_interval: 10
    combo_per: 5
    combo_bonus: 5
    palettes:
      - { key: m3_pk, level: 1, bg_top: "#FFF8E7", bg_bottom: "#FFE4C4", primary: "#FF6B81", accent: "#7ED957" }
      - { key: m3_pp, level: 2, bg_top: "#FDE8EF", bg_bottom: "#FFD3E0", primary: "#FF6B81", accent: "#7ED957" }
      - { key: m3_gr, level: 3, bg_top: "#F0FDE8", bg_bottom: "#DCFCD0", primary: "#FF6B81", accent: "#7ED957" }

reward:
  continue: { cost_ad: true, max_once_per_run: 1 }

ad:
  interstitial_after_gameover_2plus: true

progression:
  save_schema_version: 1
  best_score: 0
  # (dummy — để pipeline validate config chung M1 pass)
  milestone_interval: 10
  combo_per: 5
  combo_bonus: 5
  palettes:
    - { key: m3_pk, level: 1, bg_top: "#FFF8E7", bg_bottom: "#FFE4C4", primary: "#FF6B81", accent: "#7ED957" }
    - { key: m3_pp, level: 2, bg_top: "#FDE8EF", bg_bottom: "#FFD3E0", primary: "#FF6B81", accent: "#7ED957" }
    - { key: m3_gr, level: 3, bg_top: "#F0FDE8", bg_bottom: "#DCFCD0", primary: "#FF6B81", accent: "#7ED957" }

